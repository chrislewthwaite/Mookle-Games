<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mookle Games</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            min-height: 100vh;
            padding: 24px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f5f5f5;
            font-family: Arial, sans-serif;
        }

        .logo-container {
            text-align: center;
        }

        .logo-container img {
            max-width: 500px;
            height: auto;
            width: 100%;
        }

        .game {
            display: grid;
            justify-items: center;
            gap: 10px;
            max-width: 420px;
            margin: 32px auto 0;
            padding: 22px 24px 20px;
            border-radius: 20px;
            background: #0b2430;
            color: #f3ead3;
            text-decoration: none;
            box-shadow: 0 14px 30px rgba(11, 36, 48, .25);
            transition: transform .15s;
        }

        .game:hover { transform: translateY(-2px); }
        .logo-container .game img { max-width: 260px; }
        .game span { font-size: 15px; line-height: 1.5; }
        .game b { color: #ffa066; font-size: 16px; }
    </style>
</head>
<body>
    <div class="logo-container">
        <img src="mookle_games_logo.png" alt="Mookle Games">
        <a class="game" href="wildfall/">
            <img src="wildfall/img/wildfall-logo.webp" alt="Wildfall Salvagers" width="260" height="122">
            <span>A twin-stick looter shooter for Android phones. Coming soon to Google Play.</span>
            <b>Explore the game &rarr;</b>
        </a>
    </div>
</body>
</html>
